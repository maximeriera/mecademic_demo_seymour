# config.yaml — Seymour demo cell
#
# Workspace for the Mecademic demo app. Run it with:
#   python <path to>/mecademic_demo_app/app.py --workspace <path to this folder>
# or, on the demo box, `docker compose up -d` in ~/demo_ws (it starts on this folder).
#
# Every entry under `devices:` is checked at startup against
# mecademic_demo_app/devices/registry.py: an unknown type or a missing value
# is an error that blocks INITIALIZE, an unknown key is a warning and is
# ignored. Both show in a banner at the top of the UI. The keys each type
# accepts are listed in mecademic_demo_app/app_logic/config.yaml and returned
# by GET /api/devices/types.

title: "Seymour demo cell"

# Params and variables (Variables tab) are declared in context.yaml, next to
# this file. Production history goes to logs/history/<this folder name>/.

# ============================================================
# DEVICES — names are the keys task code uses: devices["scara"]
# ============================================================
devices:

  # --- Robots (programs they run: robot_programs.py) ---
  meca_lmi:                         # carries the LMI sensor
    type: "mecademic"
    ip_address: "192.168.0.20"

  meca_insert:                      # inserts the part, corrected by the scan
    type: "mecademic"
    ip_address: "192.168.0.21"

  scara:                            # picks from the Asyril (vacuum), presents the part
    type: "mecademic"
    ip_address: "192.168.0.30"

  # --- Sensor and feeder ---
  lmi_sensor:
    type: "lmi"
    ip_address: "192.168.0.10"
    control_port: 8190              # must match GoPxL
    data_port: 8190
    health_port: 8190
    delimiter: ","                  # must match GoPxL
    terminator: "\r\n"              # must match GoPxL

  asyril:
    type: "asyril"
    ip_address: "192.168.0.50"      # Eye+ controller
    recipe: 13843                   # production recipe (calibration uses 13186, see calib.py)
    port: 7171

# ============================================================
# MANUAL ACTIONS — buttons on the Manual tab and in the custom view
# ============================================================
# Each key must be returned by get_manual_actions() in manual_actions.py,
# otherwise the app refuses to start this workspace.
manual_actions:
  - key: "scan"
    label: "Scan (inspection only)"
    description: "One line scan with the LMI sensor on meca_lmi. Result in the log and the custom view. No pick or insertion."
    confirm_title: "Run a line scan?"
    confirm_message: "meca_lmi will run its scan program. Make sure the scan area is clear."

  - key: "asyril_pick"
    label: "Asyril pick"
    description: "Pick one part from the Asyril with the SCARA and keep it held."
    confirm_title: "Pick one part?"
    confirm_message: "The SCARA will move to the feeder and pick. Make sure it is in a safe state and its gripper is empty."

  - key: "release_part"
    label: "Release SCARA part"
    description: "The SCARA releases whatever it holds, then goes home."
    confirm_title: "Release the part?"
    confirm_message: "The SCARA will move and release its part. Keep clear of the cell."

  - key: "shake_feeder"
    label: "Shake feeder"
    description: "Vibrate the Asyril platform and prepare a new part. No robot moves."
    confirm_title: "Shake the feeder?"
    confirm_message: "The Asyril platform will vibrate."

# ============================================================
# SEQUENCES — expected top-level step order, per task
# ============================================================
# Gives "Step 2 of 6", a progress bar and greyed-out upcoming steps. Names
# must match the context.step("...") names in the code exactly. (No
# "manual:<key>" sequences: the app nests a manual action's steps under its
# own "Manual: <key>" step, so such a sequence never advances.)
sequences:
  prod_cycle:
    - Pick part from feeder         # skipped when the SCARA still holds a part
    - Present part
    - Scan part
    - Insert part                   # these two only when the scan was valid
    - Verify insertion
    - Retract

  home:
    - Park LMI robot
    - Home SCARA
    - Home insertion robot
    - Home LMI robot

  shipment:
    - No shipment sequence defined

  calib:
    - Start feeder calibration
    - Take calibration target
    - Capture calibration images
    - Return calibration target
    - Compute calibration
    - Restart feeder production
